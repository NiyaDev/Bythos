name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'C3 compiler version to use'
        required: false
        default: 'v0.7.10'

env:
  C3_VERSION: v0.7.10

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y\
            libgl1-mesa-dev \
            libspng-dev

      - name: Build SDL3
        run: |
          git clone https://github.com/libsdl-org/SDL.git
          cd SDL
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Setup C3
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || env.C3_VERSION }}"
          mkdir -p /opt/c3
          wget -O /tmp/c3.tar.gz "https://github.com/c3lang/c3c/releases/download/${VERSION}/c3-linux.tar.gz"
          tar -xvzf /tmp/c3.tar.gz -C /opt/c3 --strip-components=1
          echo "/opt/c3" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: |
          c3c test

